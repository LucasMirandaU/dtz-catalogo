name: Alerta Diaria WhatsApp (15hs)

on:
  schedule:
    # Corre todos los días a las 18:00 UTC, que son las 15:00 en Argentina
    - cron: '0 18 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub para probar

jobs:
  verificar_y_alertar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js axios dotenv

      - name: Ejecutar script de alertas
        run: node alerta_24hs.js
